<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Analytics to Sheet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #15202b;
      color: #fff;
      padding: 16px;
    }

    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status {
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .status.info {
      background: #1d3a4d;
      color: #8ecdf8;
    }

    .status.success {
      background: #1a3d2e;
      color: #7dd3a8;
    }

    .status.error {
      background: #3d1a1a;
      color: #f87171;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .data-item {
      background: #1d2d3d;
      padding: 8px;
      border-radius: 6px;
    }

    .data-item.full-width {
      grid-column: span 2;
    }

    .data-label {
      font-size: 10px;
      color: #8899a6;
      margin-bottom: 2px;
    }

    .data-value {
      font-size: 14px;
      font-weight: 600;
    }

    .data-value.highlight {
      color: #1da1f2;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary {
      background: #1da1f2;
      color: #fff;
    }

    button.primary:hover {
      background: #1a91da;
    }

    button.primary:disabled {
      background: #38444d;
      color: #8899a6;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: #1da1f2;
      border: 1px solid #1da1f2;
      margin-top: 8px;
    }

    button.secondary:hover {
      background: rgba(29, 161, 242, 0.1);
    }

    .settings {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #38444d;
    }

    .settings-title {
      font-size: 12px;
      color: #8899a6;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #38444d;
      border-radius: 6px;
      background: #192734;
      color: #fff;
      font-size: 12px;
      margin-bottom: 8px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1da1f2;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
    Analytics to Sheet
  </h1>

  <div id="status" class="status info">データを取得するにはXのツイートページを開いてください</div>

  <div id="dataSection" class="hidden">
    <div class="data-grid">
      <div class="data-item full-width">
        <div class="data-label">アカウントID</div>
        <div class="data-value" id="accountId">-</div>
      </div>
      <div class="data-item full-width">
        <div class="data-label">ポストID</div>
        <div class="data-value" id="postId">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">インプレッション</div>
        <div class="data-value" id="impressions">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">いいね</div>
        <div class="data-value" id="likes">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">リポスト</div>
        <div class="data-value" id="reposts">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">返信</div>
        <div class="data-value" id="replies">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">プロフクリック</div>
        <div class="data-value highlight" id="profileClicks">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">新規フォロー</div>
        <div class="data-value highlight" id="newFollows">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">ブックマーク</div>
        <div class="data-value" id="bookmarks">-</div>
      </div>
      <div class="data-item">
        <div class="data-label">エンゲージメント率</div>
        <div class="data-value" id="engagementRate">-</div>
      </div>
    </div>

    <button id="sendBtn" class="primary">シートに送信</button>
    <button id="refreshBtn" class="secondary">データを再取得</button>
  </div>

  <div class="settings">
    <div class="settings-title">GAS Web App URL</div>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/xxxxx/exec">
    <button id="saveBtn" class="secondary">URLを保存</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
